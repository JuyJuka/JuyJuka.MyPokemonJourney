<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>XML Editor + Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 20px; color: #111; background: #f5f5f5; }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 20px 0; }
  
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 2px solid #ddd;
  }
  .tab-btn {
    padding: 10px 20px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 1rem;
    border-bottom: 3px solid transparent;
    transition: all 0.3s;
  }
  .tab-btn.active {
    border-bottom-color: #0066cc;
    color: #0066cc;
    font-weight: bold;
  }
  .tab-btn:hover {
    background: #f0f0f0;
  }
  
  .tab-content {
    display: none;
    background: white;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .tab-content.active {
    display: block;
  }
  
  .controls {
    gap: 8px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 15px;
  }
  label {
    font-size: 0.9rem;
    font-weight: 500;
  }
  input[type=file] {
    margin-left: 6px;
  }
  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #f7f7f7;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  button:hover {
    background: #eee;
    border-color: #999;
  }
  button.primary {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
  }
  button.primary:hover {
    background: #0052a3;
  }
  button.danger {
    background: #cc3333;
    color: white;
    border-color: #cc3333;
  }
  button.danger:hover {
    background: #a02020;
  }
  
  #status {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  #status.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  #status.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
  #status.info {
    background: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
  }
  
  .split-view {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 15px;
  }
  @media (max-width: 1000px) {
    .split-view {
      grid-template-columns: 1fr;
    }
  }
  
  .panel {
    background: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
  }
  .panel h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 1rem;
  }
  
  textarea {
    width: 100%;
    height: 400px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    resize: vertical;
  }
  
  #output {
    border: 1px solid #ddd;
    padding: 15px;
    min-height: 200px;
    background: white;
    border-radius: 4px;
    overflow: auto;
    max-height: 600px;
  }
  #output.empty {
    color: #999;
    font-style: italic;
  }
  
  .button-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  
  .template-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
  }
  .template-buttons button {
    flex: 1;
    min-width: 150px;
  }
  
  .char-count {
    font-size: 0.85rem;
    color: #666;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🐉 XML Editor + XSLT Viewer</h1>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="editor">📝 XML Editor</button>
      <button class="tab-btn" data-tab="viewer">👁️ Viewer</button>
    </div>

    <!-- TAB 1: XML EDITOR -->
    <div id="editor" class="tab-content active">
      <div class="controls">
        <label>XML-Datei laden: <input id="xmlLoad" type="file" accept=".xml,application/xml"></label>
      </div>
      
      <div class="template-buttons">
        <button id="newEmpty" class="primary">✨ Neue leere XML</button>
        <button id="newPokemon" class="primary">🐾 Pokemon-Vorlage</button>
      </div>

      <div class="split-view">
        <div class="panel">
          <h3>XML-Inhalt</h3>
          <textarea id="xmlEditor" placeholder="Deine XML hier oder lade eine Datei..."></textarea>
          <div class="char-count">Zeichen: <span id="charCount">0</span></div>
        </div>
        
        <div class="panel">
          <h3>Aktionen</h3>
          <div class="button-group" style="margin-bottom: 15px;">
            <button id="formatXml" class="primary">🎯 Formatieren</button>
            <button id="validateXml" class="primary">✓ Validieren</button>
          </div>
          
          <div class="button-group">
            <button id="downloadXml" class="primary">💾 XML herunterladen</button>
            <button id="copyXml">📋 Kopieren</button>
            <button id="clearXml" class="danger">🗑️ Löschen</button>
          </div>
          
          <div id="status"></div>
        </div>
      </div>
    </div>

    <!-- TAB 2: VIEWER -->
    <div id="viewer" class="tab-content">
      <div class="controls">
        <label>XSL-Datei (optional): <input id="xslFile" type="file" accept=".xsl,text/xsl,application/xslt+xml"></label>
        <button id="apply" class="primary">▶️ Transformation anwenden</button>
      </div>
      
      <div id="status"></div>
      
      <div class="split-view" style="margin-top: 15px;">
        <div class="panel">
          <h3>Vorschau</h3>
          <div id="output" class="empty">Laden Sie eine XML-Datei und klicken Sie auf "Transformation anwenden"</div>
        </div>
        
        <div class="panel">
          <h3>Export</h3>
          <button id="downloadHtml" class="primary" style="width: 100%;">📥 Ergebnis als HTML speichern</button>
        </div>
      </div>
    </div>
  </div>

<script>
// State
let xmlDoc = null;
let xslDoc = null;
let currentXmlText = '';

// ============ TAB SWITCHING ============
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tabName = btn.dataset.tab;
    
    // Deactivate all tabs
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    // Activate selected tab
    btn.classList.add('active');
    document.getElementById(tabName).classList.add('active');
  });
});

// ============ UTILITY FUNCTIONS ============
function getStatusEl(tabName) {
  return document.querySelector(`#${tabName} #status`);
}

function showStatus(message, type = 'info', tabName = 'editor') {
  const status = getStatusEl(tabName);
  status.textContent = message;
  status.className = type;
}

function readFile(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsText(file);
  });
}

function formatXmlString(xml) {
  let formatted = '';
  let indent = '';
  const tab = '  ';
  
  xml.replace(/><|>$/g, (match) => {
    if (match === '>') {
      formatted += match + '\n' + indent;
    } else {
      formatted += match + '\n' + (xml[xml.indexOf(match) + 2] === '/' ? indent.slice(0, -tab.length) : indent + tab);
      indent = xml[xml.indexOf(match) + 2] === '/' ? indent.slice(0, -tab.length) : indent + tab;
    }
    return '';
  }).split('><').forEach(el => {
    formatted += '<' + el + '>';
  });
  
  return formatted.trim();
}

// Better XML formatter
function formatXmlProper(xmlStr) {
  try {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlStr, 'application/xml');
    
    if (xmlDoc.querySelector('parsererror')) {
      return xmlStr;
    }
    
    const serializer = new XMLSerializer();
    let formatted = serializer.serializeToString(xmlDoc);
    
    // Add line breaks and indentation
    formatted = formatted.replace(/></g, '>\n<');
    formatted = formatted.replace(/\n/g, '\n');
    
    // Basic indentation
    let lines = formatted.split('\n');
    let indent = 0;
    let result = [];
    
    lines.forEach(line => {
      let trimmed = line.trim();
      if (trimmed.startsWith('</')) {
        indent--;
      }
      if (trimmed) {
        result.push('  '.repeat(Math.max(0, indent)) + trimmed);
      }
      if (trimmed.startsWith('<') && !trimmed.startsWith('</') && !trimmed.endsWith('/>') && !trimmed.includes('<?')) {
        indent++;
      }
    });
    
    return result.join('\n');
  } catch(e) {
    return xmlStr;
  }
}

function validateXml(xmlStr) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlStr, 'application/xml');
  return !doc.querySelector('parsererror');
}

// ============ EDITOR TAB ============

// Load XML file
document.getElementById('xmlLoad').addEventListener('change', async (e) => {
  if (!e.target.files.length) return;
  try {
    currentXmlText = await readFile(e.target.files[0]);
    document.getElementById('xmlEditor').value = currentXmlText;
    updateCharCount();
    
    // Try to parse
    const parser = new DOMParser();
    xmlDoc = parser.parseFromString(currentXmlText, 'application/xml');
    
    if (xmlDoc.querySelector('parsererror')) {
      showStatus('⚠️ XML geladen, aber Parsing-Fehler erkannt', 'error', 'editor');
    } else {
      showStatus('✅ XML erfolgreich geladen', 'success', 'editor');
    }
  } catch (err) {
    showStatus('❌ Fehler beim Laden: ' + err.message, 'error', 'editor');
  }
});

// New empty XML
document.getElementById('newEmpty').addEventListener('click', () => {
  document.getElementById('xmlEditor').value = '<?xml version="1.0" encoding="UTF-8"?>\n<root>\n  \n</root>';
  updateCharCount();
  showStatus('✨ Neue leere XML erstellt', 'info', 'editor');
});

// Pokemon template
document.getElementById('newPokemon').addEventListener('click', () => {
  const template = `<?xml version="1.0" encoding="UTF-8"?>
<Spielsammlung>
  <Spiel Name="Mein Pokemon Abenteuer">
    <Trainer>
      <Name>Dein Name</Name>
      <Team>
        <Name>Team 1</Name>
        <Pokemon>
          <Name>Pikachu</Name>
          <Rasse>
            <ID>25</ID>
            <Name>Pikachu</Name>
          </Rasse>
          <Level>50</Level>
          <Geschlecht>m</Geschlecht>
        </Pokemon>
      </Team>
    </Trainer>
  </Spiel>
</Spielsammlung>`;
  
  document.getElementById('xmlEditor').value = template;
  updateCharCount();
  showStatus('🐾 Pokemon-Vorlage geladen', 'info', 'editor');
});

// Format XML
document.getElementById('formatXml').addEventListener('click', () => {
  try {
    const xmlStr = document.getElementById('xmlEditor').value;
    if (!xmlStr.trim()) {
      showStatus('⚠️ Keine XML zum Formatieren', 'error', 'editor');
      return;
    }
    
    const formatted = formatXmlProper(xmlStr);
    document.getElementById('xmlEditor').value = formatted;
    updateCharCount();
    showStatus('✅ XML formatiert', 'success', 'editor');
  } catch (err) {
    showStatus('❌ Fehler: ' + err.message, 'error', 'editor');
  }
});

// Validate XML
document.getElementById('validateXml').addEventListener('click', () => {
  const xmlStr = document.getElementById('xmlEditor').value;
  if (!xmlStr.trim()) {
    showStatus('⚠️ Keine XML zum Validieren', 'error', 'editor');
    return;
  }
  
  if (validateXml(xmlStr)) {
    showStatus('✅ XML ist valide', 'success', 'editor');
  } else {
    showStatus('❌ XML ist nicht valide', 'error', 'editor');
  }
});

// Download XML
document.getElementById('downloadXml').addEventListener('click', () => {
  const xmlStr = document.getElementById('xmlEditor').value;
  if (!xmlStr.trim()) {
    showStatus('⚠️ Kein XML-Inhalt zum Speichern', 'error', 'editor');
    return;
  }
  
  const blob = new Blob([xmlStr], { type: 'application/xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'export.xml';
  a.click();
  URL.revokeObjectURL(a.href);
  showStatus('💾 XML heruntergeladen', 'success', 'editor');
});

// Copy to clipboard
document.getElementById('copyXml').addEventListener('click', async () => {
  const xmlStr = document.getElementById('xmlEditor').value;
  if (!xmlStr.trim()) {
    showStatus('⚠️ Kein XML-Inhalt zum Kopieren', 'error', 'editor');
    return;
  }
  
  try {
    await navigator.clipboard.writeText(xmlStr);
    showStatus('📋 In Zwischenablage kopiert', 'success', 'editor');
  } catch (err) {
    showStatus('❌ Fehler beim Kopieren', 'error', 'editor');
  }
});

// Clear XML
document.getElementById('clearXml').addEventListener('click', () => {
  if (confirm('Willst du den XML-Inhalt wirklich löschen?')) {
    document.getElementById('xmlEditor').value = '';
    updateCharCount();
    xmlDoc = null;
    showStatus('🗑️ XML gelöscht', 'info', 'editor');
  }
});

function updateCharCount() {
  const count = document.getElementById('xmlEditor').value.length;
  document.getElementById('charCount').textContent = count;
}

document.getElementById('xmlEditor').addEventListener('input', updateCharCount);

// ============ VIEWER TAB ============

// Load XSL file
document.getElementById('xslFile').addEventListener('change', async (e) => {
  if (!e.target.files.length) return;
  try {
    const txt = await readFile(e.target.files[0]);
    xslDoc = new DOMParser().parseFromString(txt, 'application/xml');
    
    if (xslDoc.querySelector('parsererror')) {
      showStatus('⚠️ XSL geladen, aber Parsing-Fehler', 'error', 'viewer');
    } else {
      showStatus('✅ XSL erfolgreich geladen', 'success', 'viewer');
    }
  } catch (err) {
    showStatus('❌ Fehler: ' + err.message, 'error', 'viewer');
  }
});

// Apply transformation
document.getElementById('apply').addEventListener('click', () => {
  const xmlStr = document.getElementById('xmlEditor').value;
  
  if (!xmlStr.trim()) {
    showStatus('❌ Bitte zuerst XML im Editor einfügen/laden', 'error', 'viewer');
    return;
  }
  
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlStr, 'application/xml');
    
    if (doc.querySelector('parsererror')) {
      showStatus('❌ XML hat Fehler und kann nicht transformiert werden', 'error', 'viewer');
      return;
    }
    
    if (!xslDoc) {
      showStatus('ℹ️ Keine XSL-Datei. Zeige rohe XML-Struktur', 'info', 'viewer');
      const output = document.getElementById('output');
      output.innerHTML = '<pre>' + xmlStr.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';
      output.classList.remove('empty');
      return;
    }
    
    const proc = new XSLTProcessor();
    proc.importStylesheet(xslDoc);
    const frag = proc.transformToFragment(doc, document);
    
    const output = document.getElementById('output');
    output.innerHTML = '';
    output.appendChild(frag);
    output.classList.remove('empty');
    
    showStatus('✅ Transformation erfolgreich', 'success', 'viewer');
  } catch (err) {
    showStatus('❌ Fehler: ' + err.message, 'error', 'viewer');
    document.getElementById('output').textContent = 'Fehler bei der Transformation: ' + err.message;
  }
});

// Download HTML
document.getElementById('downloadHtml').addEventListener('click', () => {
  const output = document.getElementById('output');
  
  if (!output.innerHTML.trim() || output.classList.contains('empty')) {
    showStatus('⚠️ Kein Ergebnis zum Speichern. Wende Transformation an!', 'error', 'viewer');
    return;
  }
  
  const html = '<!doctype html>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' + output.innerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result.html';
  a.click();
  URL.revokeObjectURL(a.href);
  showStatus('📥 HTML heruntergeladen', 'success', 'viewer');
});

// Initial setup
updateCharCount();
</script>
</body>
</html>
